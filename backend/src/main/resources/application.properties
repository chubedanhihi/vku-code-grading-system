spring.application.name=vku-code-grading-backend
server.port=8080

# ===== MySQL DataSource (Docker: port 3307) =====
spring.datasource.url=jdbc:mysql://localhost:3307/vku_judge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Jackson: Serialize LocalDateTime as ISO string =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===== Judge Engine =====
# docker (mặc định, an toàn) | local (CHỈ dev/test, không cách ly)
judge.sandbox=${JUDGE_SANDBOX:docker}
judge.image=vku-sandbox:latest
judge.build-dir=${JUDGE_BUILD_DIR:../sandbox}
judge.work-dir=${JUDGE_WORK_DIR:${user.home}/.vku-judge/work}
judge.workers=${JUDGE_WORKERS:2}
judge.max-pending-per-user=3

# ===== Bảo mật =====
# Đặt JWT_SECRET (>= 32 ký tự) ở production; nếu bỏ trống sẽ dùng khóa ngẫu nhiên mỗi lần khởi động.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=24
# Mã mời để đăng ký tài khoản GIẢNG VIÊN. Để trống = tắt tự đăng ký giảng viên.
app.teacher-invite-code=${TEACHER_INVITE_CODE:vku-teacher-2026}
